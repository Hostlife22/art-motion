name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: '1.63.0'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Python and Chromium
        run: |
          uv python install 3.12
          uv run --isolated --python 3.12 --with "playwright==$PLAYWRIGHT_VERSION" playwright install --with-deps chromium

      - name: Check source and documentation
        run: uv run --python 3.12 python scripts/check_repository.py

      - name: Test release packaging
        run: uv run --python 3.12 python -m unittest discover -s tests -v

      - name: Smoke-test gallery, Milo and configurable clips
        run: |
          uv run --isolated --python 3.12 --with "playwright==$PLAYWRIGHT_VERSION" python scripts/engine/render.py --film gallery --solo 09_postimp --stills 0.3 --out renders/gallery
          uv run --isolated --python 3.12 --with "playwright==$PLAYWRIGHT_VERSION" python scripts/engine/render.py --film demos/milo_pixel_adventure --stills 2,8,14 --out renders/milo
          uv run --isolated --python 3.12 --with "playwright==$PLAYWRIGHT_VERSION" python scripts/engine/render.py --spec scripts/engine/examples/t3_finance_chart.json --stills 3 --out renders/chart

      - name: Build release archives
        run: uv run --python 3.12 python scripts/build_release.py

      - name: Save release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          release_args=(--verify-tag --generate-notes --title "art-motion $RELEASE_TAG")
          edit_args=(--draft=false)
          if [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            release_args+=(--prerelease --latest=false)
            edit_args+=(--prerelease --latest=false)
          fi
          if draft=$(gh release view --json isDraft --jq '.isDraft' -- "$RELEASE_TAG" 2>/dev/null); then
            if [[ "$draft" == 'true' ]]; then
              gh release upload --clobber -- "$RELEASE_TAG" art-motion.zip art-motion.tar.gz SHA256SUMS
              gh release edit "${edit_args[@]}" -- "$RELEASE_TAG"
            else
              echo "Release already published: $RELEASE_TAG"
            fi
            exit 0
          fi
          gh release create "${release_args[@]}" -- "$RELEASE_TAG" art-motion.zip art-motion.tar.gz SHA256SUMS
